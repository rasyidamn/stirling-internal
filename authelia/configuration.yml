# Authelia 4.39 - shared settings. The authentication backend lives in
# backend-file.yml (test mode) or backend-ldap.yml (Active Directory), selected
# with AUTH_BACKEND in .env. Values in {{ env "..." }} come from .env
# (X_AUTHELIA_CONFIG_FILTERS=template). Secrets are passed as AUTHELIA_* env vars.
---
theme: auto
default_2fa_method: ''

server:
  # Served under https://<PDF_HOSTNAME>/auth so only ONE DNS name is needed.
  address: 'tcp://:9091/auth'

log:
  level: info

identity_validation:
  reset_password:
    # secret: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET
    jwt_lifespan: 5m

totp:
  disable: true
webauthn:
  disable: true

access_control:
  default_policy: deny
  rules:
    - domain: '{{ env "PDF_HOSTNAME" }}'
      subject:
        - 'group:{{ env "PDF_GROUP" }}'
      policy: one_factor

session:
  # secret: AUTHELIA_SESSION_SECRET
  # No Redis: sessions live in memory. Fine for one small server; staff simply
  # log in again after an Authelia restart.
  name: pdftools_session
  same_site: lax
  inactivity: 1h
  expiration: 8h
  remember_me: -1
  cookies:
    - domain: '{{ env "PDF_HOSTNAME" }}'
      authelia_url: 'https://{{ env "PDF_HOSTNAME" }}/auth'
      default_redirection_url: 'https://{{ env "PDF_HOSTNAME" }}/'

regulation:
  # Keep this BELOW the AD account-lockout threshold so a password-guessing
  # attempt is stopped here instead of locking the user's Windows account.
  max_retries: 5
  find_time: 10m
  ban_time: 15m

storage:
  # encryption_key: AUTHELIA_STORAGE_ENCRYPTION_KEY
  # SQLite file: no extra database container to maintain.
  local:
    path: /data/db.sqlite3

notifier:
  # No e-mail needed (password reset is disabled; AD passwords are managed in AD).
  filesystem:
    filename: /data/notification.txt
